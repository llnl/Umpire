# Override reproducer section to define Umpire specific variables.
.tuolumne_reproducer_vars:
  script:
    - !reference [.reproducer_vars, script]

# Overridden shared jobs
########################
# We duplicate the shared jobs description and add necessary changes for RAJA.
# We keep ${PROJECT_<MACHINE>_VARIANTS} and ${PROJECT_<MACHINE>_DEPS} So that
# the comparison with the original job is easier.

# Override rocm 7.2.1 job to allow failure
rocmcc_7_2_1_hip:
  variables:
    SPEC: "${PROJECT_TUOLUMNE_VARIANTS} +rocm amdgpu_target=gfx942 %llvm-amdgpu@=7.2.1 ^hip@7.2.1 ${PROJECT_TUOLUMNE_DEPS}"
  extends: .job_on_tuolumne
  allow_failure: true

# We override the cce job because we can’t use +device-alloc with it
cce_21_0_0:
  variables:
    SPEC: "~shared +fortran tests=basic %cce@=21.0.0"
  extends: .job_on_tuolumne

############
# Extra jobs
############
# We do not recommend using ${PROJECT_<MACHINE>_VARIANTS} and
# ${PROJECT_<MACHINE>_DEPS} in the extra jobs. There is not reason not to fully
# describe the spec here.

# Keep C/C++ on GCC while using LLVM-AMDGPU only for HIP.
# Disable Fortran to isolate mixed C/C++ and HIP compiler support.
gcc_13_3_1_rocmcc_6_4_3_hip:
  variables:
    SPEC: "~shared ~fortran +rocm +device_alloc tests=basic amdgpu_target=gfx942 %c,cxx=gcc@=13.3.1 %hip-lang=llvm-amdgpu@=6.4.3 ^hip@6.4.3"
  extends: .job_on_tuolumne

###
# This job intentionally tests our umpire package.py because although this job does not
# explicitly have the ~tools, the package.py should still prevent tools from being built.
###
rocmcc_6_4_3_hip_openmp_device_alloc:
  variables:
    SPEC: "~shared +fortran +openmp +rocm +device_alloc tests=basic amdgpu_target=gfx942 %llvm-amdgpu@=6.4.3 ^hip@6.4.3"
  extends: .job_on_tuolumne

rocmcc_6_4_3_hip_deviceconst:
  variables:
    SPEC: "~shared +fortran +deviceconst +rocm tests=basic amdgpu_target=gfx942 %llvm-amdgpu@=6.4.3 ^hip@6.4.3"
  extends: .job_on_tuolumne
