# Override reproducer section to define Umpire specific variables.
.corona_reproducer_vars:
  script:
    - !reference [.reproducer_vars, script]

########################
# Overridden shared jobs
########################
# We duplicate the shared jobs description and add necessary changes for RAJA.
# We keep ${PROJECT_<MACHINE>_VARIANTS} and ${PROJECT_<MACHINE>_DEPS} So that
# the comparison with the original job is easier.

# We need to set the fortran compiler to enforce coherent CXX support accross build and link:
rocmcc_6_4_3_hip:
  variables:
    SPEC: "${PROJECT_CORONA_VARIANTS} +rocm amdgpu_target=gfx906 %c=llvm-amdgpu@=6.4.3 %cxx=llvm-amdgpu@=6.4.3 %fortran=gcc@13: ^hip@6.4.3 ${PROJECT_CORONA_DEPS}"
    MODULE_LIST: "rocm/6.4.3"
  extends: .job_on_corona

############
# Extra jobs
############
# We do not recommend using ${PROJECT_<MACHINE>_VARIANTS} and
# ${PROJECT_<MACHINE>_DEPS} in the extra jobs. There is not reason not to fully
# describe the spec here.

###
# This job intentionally tests our umpire package.py because although this job does not
# explicitly have the ~tools, the package.py should still disable tools from being built.
###
rocmcc_5_7_1_hip_openmp_device_alloc:
  variables:
    SPEC: "~shared +fortran +openmp +device_alloc tests=basic +rocm amdgpu_target=gfx906 %llvm-amdgpu@=5.7.1 ^hip@5.7.1"
  extends: .job_on_corona

