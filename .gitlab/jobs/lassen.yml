# Override reproducer section to define Umpire specific variables.
.lassen_reproducer_vars:
  script:
    - !reference [.reproducer_vars, script]

########################
# Overridden shared jobs
########################
# We duplicate the shared jobs description and add necessary changes for RAJA.
# We keep ${PROJECT_<MACHINE>_VARIANTS} and ${PROJECT_<MACHINE>_DEPS} So that
# the comparison with the original job is easier.

clang_14_0_5_ibm_gcc_8_3_1_cuda_11_7_0:
  variables:
    RAD_BAT_SPEC: "${PROJECT_LASSEN_VARIANTS} +cuda %clang-14-ibm ^cuda@11.7.0+allow-unsupported-compilers ${PROJECT_LASSEN_DEPS}"
    MODULE_LIST: "cuda/11.7.0"
  extends: .job_on_lassen
  allow_failure: true

clang_14_0_5_gcc_8_3_1_cuda_11_7_0:
  variables:
    RAD_BAT_SPEC: "${PROJECT_LASSEN_VARIANTS} +cuda %clang-14 ^cuda@11.7.0+allow-unsupported-compilers ${PROJECT_LASSEN_DEPS}"
    MODULE_LIST: "cuda/11.7.0"
  extends: .job_on_lassen
  allow_failure: true

clang_16_0_6_ibm_gcc_11_2_1_cuda_11_8_0:
  variables:
    RAD_BAT_SPEC: "${PROJECT_LASSEN_VARIANTS} +cuda %clang-16-ibm ^cuda@11.8.0+allow-unsupported-compilers ${PROJECT_LASSEN_DEPS}"
    MODULE_LIST: "cuda/11.8.0"
  extends: .job_on_lassen
  allow_failure: true

clang_16_0_6_gcc_11_2_1_cuda_11_8_0:
  variables:
    RAD_BAT_SPEC: "${PROJECT_LASSEN_VARIANTS} +cuda %clang-16 ^cuda@11.8.0+allow-unsupported-compilers ${PROJECT_LASSEN_DEPS}"
    MODULE_LIST: "cuda/11.8.0"
  extends: .job_on_lassen
  allow_failure: true


############
# Extra jobs
############
# We do not recommend using ${PROJECT_<MACHINE>_VARIANTS} and
# ${PROJECT_<MACHINE>_DEPS} in the extra jobs. There is no reason not to fully
# describe the spec here.

ibm_clang_14_0_5_mpi_shmem:
  variables:
    RAD_BAT_SPEC: "~shared +tools tests=basic +ipc_shmem +mpi %clang-14 ^spectrum-mpi"
  extends: .job_on_lassen

ibm_clang_14_0_5_mpi_shmem_memleak:
  variables:
    RAD_BAT_SPEC: "~shared +asan +tools tests=basic +ipc_shmem +mpi cxxflags==-fsanitize=address %clang-14 ^spectrum-mpi"
    ASAN_OPTIONS: "detect_leaks=1"
    LSAN_OPTIONS: "suppressions=/usr/workspace/umdev/MyASan.supp"
    LASSEN_JOB_ALLOC: "1 -W 20 -q pci"
  extends: .job_on_lassen

