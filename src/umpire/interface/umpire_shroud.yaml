          description: |
            Creates an untracked DynamicPoolList allocator with specified alignment.
            Untracked allocators do not track individual allocations for reduced overhead.
            The alignment parameter must be a power of 2 (e.g., 16, 32, 64, 128).
          param:
            name: Name for the new allocator
            allocator: Underlying allocator to use for memory
            initial_size: Initial pool size in bytes
            block: Minimum block size for future allocations
            alignment: Memory alignment in bytes (must be power of 2)
