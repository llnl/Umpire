      # Untracked pool allocators need explicit names to keep the generated
      # Fortran helper identifiers below compiler limits. The corresponding
      # C bufferify wrappers are overridden by the C splicer include listed
      # below, since Shroud emits invalid member calls for those helpers.
      - decl: Allocator makeAllocator_list_pool_untracked(const std::string& name, Allocator allocator, size_t initial_size, size_t block)
        options:
          F_C_name_template: c_resourcemanager_make_alloc_dynamic_p_list_u{function_suffix}{template_suffix}
        format:
          F_name_impl: make_alloc_dynamic_p_list_u
        splicer:
          c: |
            const std::string SHC_name_cxx(name);
            umpire::Allocator *SHC_allocator_cxx =
                static_cast<umpire::Allocator *>(allocator.addr);
            umpire::Allocator *SHC_rv_cxx = new umpire::Allocator;
            *SHC_rv_cxx = SH_this->makeAllocator<umpire::strategy::DynamicPoolList, false>(
                SHC_name_cxx, *SHC_allocator_cxx, initial_size, block);
            SHC_rv->addr  = SHC_rv_cxx;
            SHC_rv->idtor = 1;
            return SHC_rv;

