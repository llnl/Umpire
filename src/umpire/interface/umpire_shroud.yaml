          wrap_fortran: false

  - decl: class Allocator
    cxx_header: umpire/Allocator.hpp
    format:
      F_derived_name: UmpireAllocator

    declarations:
      - decl: ~Allocator() +name(delete)
      - decl: void* allocate(size_t bytes)
        format:
          F_name_function: allocate_pointer
      - decl: void deallocate (void* ptr)
        format:
          F_name_function: deallocate_pointer
      - decl: void release()
      - decl: size_t getSize(void* ptr)
      - decl: size_t getHighWatermark()
      - decl: size_t getCurrentSize()
      - decl: size_t getActualSize()
      - decl: size_t getAllocationCount()
      - decl: const std::string& getName() +pure
      - decl: size_t getId()

  - decl: class ResourceManager
    cxx_header: umpire/ResourceManager.hpp
    format:
      F_derived_name: UmpireResourceManager
      F_name_instance_set:
      F_name_instance_get:

    declarations:
      - decl: static ResourceManager& getInstance()

      - decl: Allocator getAllocator(const std::string& name)
        format:
          function_suffix: _by_name

      - decl: Allocator getAllocator(const int id)
        format:
          function_suffix: _by_id

      - decl: template <typename T> Allocator makeAllocator(const std::string& name, Allocator allocator, size_t initial_size, size_t block);
        options:
          F_create_generic: False
        cxx_template:
        - instantiation: <umpire::strategy::DynamicPoolList>
          format:
            F_name_impl_template: make_alloc_dynamic_p_list
            template_suffix: _list_pool
            function_suffix: ""
        - instantiation: <umpire::strategy::QuickPool>
          format:
            F_name_impl_template: make_alloc_quick_p
            template_suffix: _quick_pool
            function_suffix: ""
        - instantiation: <umpire::strategy::ResourceAwarePool>
          format:
            F_name_impl_template: make_alloc_res_aware_p
            template_suffix: _resource_aware_pool
            function_suffix: ""

      # Pool allocators with custom alignment control. These functions allow
      # users to specify memory alignment (must be a power of 2) when creating
      # pool allocators. Alignment controls the byte boundary for allocations
      # (e.g., alignment=64 ensures allocations are aligned to 64-byte boundaries).
      # Default alignment is 16 bytes if not specified.
      - decl: Allocator makeAllocator_list_pool_aligned(const std::string& name, Allocator allocator, size_t initial_size, size_t block, size_t alignment)
        doxygen:
          brief: Create a DynamicPoolList allocator with custom alignment
          description: |
            Creates a tracked DynamicPoolList allocator with specified alignment.
            The alignment parameter must be a power of 2 (e.g., 16, 32, 64, 128).
          param:
            name: Name for the new allocator
            allocator: Underlying allocator to use for memory
            initial_size: Initial pool size in bytes
            block: Minimum block size for future allocations
            alignment: Memory alignment in bytes (must be power of 2)
        options:
          F_C_name_template: c_resourcemanager_make_alloc_dynamic_p_list_a{function_suffix}{template_suffix}
        format:
          F_name_impl: make_alloc_dynamic_p_list_a
        splicer:
          c: |
            const std::string SHC_name_cxx(name);
            umpire::Allocator *SHC_allocator_cxx =
                static_cast<umpire::Allocator *>(allocator.addr);
            umpire::Allocator *SHC_rv_cxx = new umpire::Allocator;
            *SHC_rv_cxx = SH_this->makeAllocator<umpire::strategy::DynamicPoolList>(
                SHC_name_cxx, *SHC_allocator_cxx, initial_size, block, alignment);
            SHC_rv->addr  = SHC_rv_cxx;
            SHC_rv->idtor = 1;
            return SHC_rv;

      - decl: Allocator makeAllocator_quick_pool_aligned(const std::string& name, Allocator allocator, size_t initial_size, size_t block, size_t alignment)
        doxygen:
          brief: Create a QuickPool allocator with custom alignment
          description: |
            Creates a tracked QuickPool allocator with specified alignment.
            The alignment parameter must be a power of 2 (e.g., 16, 32, 64, 128).
          param:
